services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.combined
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_BASE_PATH: /dashboard/
    container_name: dws-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_TLS: ${MONGODB_TLS:-false}
    ports:
      - "80:80"
