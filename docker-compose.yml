services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dws-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGODB_TLS: ${MONGODB_TLS:-false}
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: dws-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ./dashboard/.env
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "8080:80"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: dws-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
